{
  "id": "derelict_station",
  "version": 1,
  "mode": "adventure",
  "title": "Derelict Station",
  "setting": {
    "location": "abandoned research station",
    "threat": "pirates"
  },
  "objectives": [
    "recover archive",
    "escape safely"
  ],
  "actors": [
    "pirate captain",
    "station AI"
  ],
  "stateSchema": {
    "location": "string",
    "archive_found": "bool",
    "pirates_alerted": "bool",
    "ship_hull": "int",
    "has_keycard": "bool"
  },
  "state": {
    "location": "station_dock",
    "archive_found": false,
    "pirates_alerted": false,
    "ship_hull": 100,
    "has_keycard": false
  },
  "moves": [
    {
      "id": "enter_corridor",
      "label": "Enter the dark corridor",
      "description": "Leave the dock and move into the station.",
      "when": { "location": "station_dock" },
      "effects": { "location": "station_corridor" },
      "outcome": "continue"
    },
    {
      "id": "search_lockers",
      "label": "Search crew lockers",
      "description": "Look for access credentials.",
      "when": { "location": "station_corridor", "has_keycard": false },
      "effects": { "has_keycard": true },
      "outcome": "continue"
    },
    {
      "id": "trip_alarm",
      "label": "Force the sealed hatch",
      "description": "Break into the archive wing without a keycard.",
      "when": { "location": "station_corridor", "has_keycard": false },
      "effects": { "location": "archive_room", "pirates_alerted": true, "ship_hull": 82 },
      "outcome": "continue"
    },
    {
      "id": "open_archive",
      "label": "Open the archive with the keycard",
      "description": "Use the keycard on the archive door.",
      "when": { "location": "station_corridor", "has_keycard": true, "archive_found": false },
      "effects": { "location": "archive_room", "archive_found": true },
      "outcome": "continue"
    },
    {
      "id": "grab_archive_quiet",
      "label": "Recover the archive quietly",
      "description": "Take the research archive while the station stays quiet.",
      "when": { "location": "archive_room", "archive_found": true, "pirates_alerted": false },
      "effects": { "location": "station_dock" },
      "outcome": "continue"
    },
    {
      "id": "grab_archive_hot",
      "label": "Recover the archive under alarm",
      "description": "Grab the archive while pirates are alerted.",
      "when": { "location": "archive_room", "pirates_alerted": true, "archive_found": false },
      "effects": { "archive_found": true, "ship_hull": 70 },
      "outcome": "continue"
    },
    {
      "id": "escape_success",
      "label": "Cast off and escape",
      "description": "Leave with the archive while hull integrity holds.",
      "when": { "location": "station_dock", "archive_found": true, "pirates_alerted": false },
      "effects": { "location": "deep_space" },
      "outcome": "success"
    },
    {
      "id": "escape_damaged",
      "label": "Run the gauntlet to the ship",
      "description": "Sprint back to the dock under pirate fire.",
      "when": { "location": "archive_room", "archive_found": true, "pirates_alerted": true },
      "effects": { "location": "station_dock", "ship_hull": 40 },
      "outcome": "continue"
    },
    {
      "id": "limp_home",
      "label": "Limp away with the archive",
      "description": "Escape with damage but keep the archive.",
      "when": { "location": "station_dock", "archive_found": true, "pirates_alerted": true },
      "effects": { "location": "deep_space" },
      "outcome": "success"
    },
    {
      "id": "abandon_mission",
      "label": "Abandon the archive and flee",
      "description": "Leave without the research archive.",
      "when": { "location": "station_dock", "archive_found": false },
      "effects": { "location": "deep_space" },
      "outcome": "fail"
    }
  ]
}
