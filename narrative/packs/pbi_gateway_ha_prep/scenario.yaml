{
  "id": "pbi_gateway_ha_prep",
  "version": 1,
  "mode": "lesson",
  "title": "Power BI Gateway HA Prep",
  "source": {
    "kind": "project",
    "project": "PBI",
    "note": "Thin Knowledge to Experience lesson for gateway HA cluster update prep"
  },
  "setting": {
    "location": "operations desk",
    "context": "planned Power BI Gateway high-availability cluster update"
  },
  "objectives": [
    "verify cluster health before change",
    "confirm recovery path",
    "begin update only when checks pass"
  ],
  "actors": [
    "operator",
    "gateway cluster"
  ],
  "stateSchema": {
    "phase": "string",
    "nodes_online": "bool",
    "spn_valid": "bool",
    "backup_confirmed": "bool",
    "change_window_open": "bool",
    "ready_to_update": "bool"
  },
  "state": {
    "phase": "intake",
    "nodes_online": false,
    "spn_valid": false,
    "backup_confirmed": false,
    "change_window_open": false,
    "ready_to_update": false
  },
  "moves": [
    {
      "id": "check_nodes",
      "label": "Verify both gateway nodes are online",
      "description": "Confirm HA members respond and show healthy status.",
      "when": { "phase": "intake" },
      "effects": { "phase": "checks", "nodes_online": true },
      "outcome": "continue"
    },
    {
      "id": "skip_node_check",
      "label": "Skip node health and jump to update",
      "description": "Begin without confirming cluster health.",
      "when": { "phase": "intake" },
      "effects": { "phase": "unsafe", "ready_to_update": false },
      "outcome": "fail"
    },
    {
      "id": "validate_spn",
      "label": "Validate gateway service account / SPN",
      "description": "Ensure authentication used by the gateway remains valid.",
      "when": { "phase": "checks", "nodes_online": true, "spn_valid": false },
      "effects": { "spn_valid": true },
      "outcome": "continue"
    },
    {
      "id": "confirm_backup",
      "label": "Confirm recovery / backup path",
      "description": "Verify you can restore or fail over if the update goes badly.",
      "when": { "phase": "checks", "spn_valid": true, "backup_confirmed": false },
      "effects": { "backup_confirmed": true },
      "outcome": "continue"
    },
    {
      "id": "open_window",
      "label": "Confirm change window is open",
      "description": "Only proceed inside the approved maintenance window.",
      "when": { "phase": "checks", "backup_confirmed": true, "change_window_open": false },
      "effects": { "change_window_open": true, "ready_to_update": true, "phase": "ready" },
      "outcome": "continue"
    },
    {
      "id": "begin_update",
      "label": "Begin gateway cluster update",
      "description": "Start the update after all prep checks pass.",
      "when": { "phase": "ready", "ready_to_update": true, "nodes_online": true, "spn_valid": true, "backup_confirmed": true, "change_window_open": true },
      "effects": { "phase": "updating" },
      "outcome": "success"
    },
    {
      "id": "force_update_early",
      "label": "Force update before backup confirmation",
      "description": "Push the change without a confirmed recovery path.",
      "when": { "phase": "checks", "backup_confirmed": false },
      "effects": { "phase": "unsafe", "ready_to_update": false },
      "outcome": "fail"
    }
  ]
}
