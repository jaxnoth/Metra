name: MetraCompanion
options:
  bundleIdPrefix: app.metra
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  BASE_SDK: iphoneos
  SWIFT_VERSION: "6.0"
  TARGETED_DEVICE_FAMILY: "1,2"
targets:
  MetraCompanion:
    type: application
    platform: iOS
    sources:
      - path: MetraCompanion
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.metra.companion
      # Set via Config/Local.xcconfig (gitignored) or Xcode Signing & Capabilities - do not commit a real Team ID.
      DEVELOPMENT_TEAM: ""
      INFOPLIST_KEY_CFBundleDisplayName: Metra
      INFOPLIST_KEY_NSMicrophoneUsageDescription: Metra listens when you tap the mic so you can talk on Vision.
      INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Metra turns your speech into text for Vision on this device. Recognition stays on-device unless you allow cloud speech in Settings.
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      GENERATE_INFOPLIST_FILE: YES
      CURRENT_PROJECT_VERSION: 7
      MARKETING_VERSION: "0.1.0"
    info:
      path: MetraCompanion/Info.plist
      properties:
        CFBundleDisplayName: Metra
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: Metra listens when you tap the mic so you can talk hands-free on Vision.
        NSSpeechRecognitionUsageDescription: Metra turns your speech into text for Vision on this device. Recognition stays on-device unless you allow cloud speech in Settings.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
schemes:
  MetraCompanion:
    build:
      targets:
        MetraCompanion: all
    run:
      config: Debug
